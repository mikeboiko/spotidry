glob_matcher: doublestar

pre-commit:
  parallel: true
  skip:
    - rebase
  commands:
    prettier-format:
      glob: '**/*.{js,jsx,ts,tsx,json,css,scss,md,yaml,yml}'
      run: |
        echo "Formatting files with prettier..."
        npx prettier --write {staged_files}
      stage_fixed: true

    ruff-format:
      glob: '**/*.py'
      run: |
        echo "Formatting python files with ruff..."
        uv run ruff format {staged_files}
      stage_fixed: true

    shfmt-format:
      glob: '**/*.{sh,bash}'
      run: |
        echo "Formatting shell scripts with shfmt..."
        shfmt --apply-ignore -w {staged_files}
      stage_fixed: true
